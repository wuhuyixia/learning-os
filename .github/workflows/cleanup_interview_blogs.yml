name: Clean interview blog content

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean imported interview blogs
        run: python3 .github/scripts/cleanup_interview_blogs.py

      - name: Commit cleanup
        run: |
          rm -f .github/workflows/cleanup_interview_blogs.yml
          rm -f .github/scripts/cleanup_interview_blogs.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: remove duplicated and promotional interview content"
          git push
