<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320"><rect width="1100" height="320" rx="18" fill="#f8fafc"/><style>text{font:20px Arial,'Microsoft YaHei',sans-serif;fill:#172c40}.hd{font-weight:bold;font-size:22px}.sub{font-size:16px;fill:#54697b}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#397ba6"/></marker></defs><rect x="27" y="105" width="185" height="105" rx="15" fill="#e5f0fc" stroke="#70a1ca" stroke-width="2"/><text x="119" y="144" text-anchor="middle" class="hd">IMU 原始数据</text><text x="119" y="179" text-anchor="middle" class="sub">角速度 / 比力</text><path d="M212 156H252" stroke="#397ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="105" width="230" height="105" rx="15" fill="#fff1df" stroke="#d9a362" stroke-width="2"/><text x="375" y="145" text-anchor="middle" class="hd">去零偏 + 坐标变换</text><text x="375" y="180" text-anchor="middle" class="sub">姿态更新、重力补偿</text><path d="M490 156H530" stroke="#397ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="540" y="105" width="225" height="105" rx="15" fill="#e5f4ec" stroke="#6bb391" stroke-width="2"/><text x="652" y="146" text-anchor="middle" class="hd">加速度积分</text><text x="652" y="181" text-anchor="middle" class="sub">a → v</text><path d="M765 156H805" stroke="#397ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="812" y="105" width="255" height="105" rx="15" fill="#edf0ff" stroke="#8f9ed7" stroke-width="2"/><text x="939" y="146" text-anchor="middle" class="hd">速度再积分</text><text x="939" y="181" text-anchor="middle" class="sub">v → p（位置）</text><text x="550" y="73" class="sub">陀螺仪还用于更新姿态 R 或 θ</text><text x="40" y="277" class="sub">误差来源：陀螺仪零偏 → 姿态误差 → 重力补偿误差；加速度偏差经两次积分持续累积。</text></svg>