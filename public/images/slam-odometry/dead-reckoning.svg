<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380"><rect width="1000" height="380" rx="18" fill="#f8fafc"/><style>text{font:20px Arial,'Microsoft YaHei',sans-serif;fill:#1d324b}.sm{font-size:16px;fill:#53677c}</style><defs><marker id="ax" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52677f"/></marker><marker id="mv" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#dd7545"/></marker></defs><path d="M70 318H930M70 318V42" stroke="#53677c" stroke-width="3" marker-end="url(#ax)"/><path d="M70 318H930" stroke="#53677c" stroke-width="3" marker-end="url(#ax)"/><text x="946" y="322">x</text><text x="53" y="33">y</text><path d="M225 250Q385 253 520 158" fill="none" stroke="#7b9fba" stroke-width="5" stroke-dasharray="8 8"/><circle cx="225" cy="250" r="20" fill="#9bc5eb" stroke="#326f9d" stroke-width="3"/><circle cx="520" cy="158" r="20" fill="#9bc5eb" stroke="#326f9d" stroke-width="3"/><path d="M225 250L308 218" stroke="#dd7545" stroke-width="4" marker-end="url(#mv)"/><path d="M520 158L620 88" stroke="#dd7545" stroke-width="4" marker-end="url(#mv)"/><text x="148" y="291">(xₜ,yₜ)</text><text x="528" y="194">(xₜ₊₁,yₜ₊₁)</text><text x="324" y="209">θₜ</text><text x="642" y="90">θₜ₊₁</text><text x="333" y="294">Δx = vΔt cos θₜ₊₁</text><text x="333" y="325">Δy = vΔt sin θₜ₊₁</text><text x="645" y="245" class="sm">每一步估计位移并累加</text></svg>