<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Linux 普通用户与 root 用户切换</title>
  <desc id="desc">展示 sudo su 从普通用户 pi 切换到 root，以及 su pi 从 root 切回普通用户。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5aa0d6"/></marker>
    <marker id="arrowL" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f5b51b"/></marker>
    <style>
      .cn { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: "JetBrains Mono", "Consolas", monospace; }
    </style>
  </defs>

  <rect width="1100" height="650" rx="42" fill="#176947"/>

  <g transform="translate(150 70)">
    <circle cx="0" cy="0" r="26" fill="#fff"/>
    <path d="M-40 72 Q-35 28 0 28 Q35 28 40 72 Z" fill="#fff"/>
    <text x="0" y="108" text-anchor="middle" class="cn" font-size="26" font-weight="700" fill="#75b9ec">普通用户 pi</text>
  </g>

  <g transform="translate(900 70)">
    <circle cx="0" cy="0" r="26" fill="#fff"/>
    <path d="M-42 72 Q-37 28 0 28 Q37 28 42 72 Z" fill="#fff"/>
    <path d="M-8 30 L8 30 L14 72 L-14 72 Z" fill="#176947"/>
    <path d="M-8 30 L0 46 L8 30" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="0" y="108" text-anchor="middle" class="cn" font-size="26" font-weight="700" fill="#ffc22f">超级用户 root</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="335" y="42" width="280" height="56" rx="8" fill="#225d46" stroke="#8cc7ac" stroke-dasharray="5 4"/>
    <text x="475" y="78" text-anchor="middle" class="mono" font-size="23" fill="#fff">sudo su</text>
    <text x="635" y="78" class="cn" font-size="20" fill="#79bff0">切换为 root</text>

    <rect x="350" y="132" width="260" height="56" rx="8" fill="#225d46" stroke="#e3c649" stroke-dasharray="5 4"/>
    <text x="430" y="168" text-anchor="middle" class="mono" font-size="23" fill="#fff">su pi</text>
    <text x="545" y="168" class="cn" font-size="20" fill="#ffd250">切回普通用户</text>
  </g>

  <line x1="620" y1="70" x2="805" y2="70" stroke="#5aa0d6" stroke-width="5" marker-end="url(#arrowR)"/>
  <line x1="350" y1="160" x2="260" y2="160" stroke="#f5b51b" stroke-width="5" marker-end="url(#arrowL)"/>

  <g filter="url(#shadow)">
    <rect x="65" y="245" width="970" height="300" rx="34" fill="#07100d"/>
  </g>

  <text x="125" y="310" class="mono" font-size="25" fill="#80e6ad">pi@raspberrypi:~ $</text>
  <text x="430" y="310" class="mono" font-size="25" fill="#fff">sudo su</text>

  <text x="125" y="365" class="mono" font-size="25" fill="#ffd166">root@raspberrypi:/home/pi#</text>
  <text x="555" y="365" class="mono" font-size="25" fill="#fff">su pi</text>

  <text x="125" y="420" class="mono" font-size="25" fill="#80e6ad">pi@raspberrypi:~ $</text>
  <rect x="420" y="396" width="15" height="31" fill="#19e665"/>

  <text x="735" y="300" class="cn" font-size="22" font-weight="700" fill="#75b9ec">普通用户 pi</text>
  <line x1="735" y1="310" x2="675" y2="327" stroke="#75b9ec" stroke-width="4" marker-end="url(#arrowR)"/>

  <text x="715" y="477" class="cn" font-size="22" font-weight="700" fill="#ffc22f">超级用户 root</text>
  <line x1="730" y1="457" x2="650" y2="390" stroke="#ffc22f" stroke-width="4" marker-end="url(#arrowL)"/>

  <text x="550" y="595" text-anchor="middle" class="cn" font-size="21" fill="#d9f3e7">$ 通常表示普通用户，# 通常表示 root；执行管理操作时优先使用 sudo 单条提升权限。</text>
</svg>