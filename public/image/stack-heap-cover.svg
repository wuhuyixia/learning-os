<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">栈与堆</title>
  <desc id="desc">程序运行时 Stack 与 Heap 内存模型博客封面</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#07131a"/>
    </linearGradient>
    <linearGradient id="stackGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="heapGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="180" fill="#0ea5e9" opacity="0.05"/>
  <circle cx="170" cy="565" r="230" fill="#10b981" opacity="0.045"/>

  <g font-family="Inter, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="70" y="105" font-size="58" font-weight="800" fill="#f8fafc">栈与堆</text>
    <text x="72" y="148" font-size="22" fill="#94a3b8">Stack &amp; Heap Memory Model</text>

    <g transform="translate(80 205)" filter="url(#shadow)">
      <rect width="405" height="320" rx="24" fill="#06101f" stroke="#38bdf8" stroke-width="3"/>
      <text x="28" y="44" font-size="23" font-weight="700" fill="#bae6fd">STACK</text>
      <text x="312" y="44" font-size="14" fill="#64748b">LIFO ↓</text>

      <g transform="translate(34 74)">
        <rect width="337" height="54" rx="10" fill="url(#stackGrad)" opacity="0.92"/>
        <text x="18" y="34" font-size="20" font-weight="700" fill="#fff">p : int*</text>
        <text x="225" y="34" font-size="16" fill="#dbeafe">0x20002000</text>
      </g>
      <g transform="translate(34 138)">
        <rect width="337" height="54" rx="10" fill="#164e63" stroke="#0ea5e9" stroke-width="1.5"/>
        <text x="18" y="34" font-size="20" font-weight="700" fill="#fff">q : int*</text>
        <text x="225" y="34" font-size="16" fill="#dbeafe">0x20002008</text>
      </g>
      <g transform="translate(34 202)">
        <rect width="337" height="38" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="18" y="25" font-size="15" fill="#94a3b8">return address / local variables</text>
      </g>
      <text x="34" y="284" font-size="15" fill="#64748b">automatic allocation · function frame</text>
    </g>

    <g transform="translate(605 205)" filter="url(#shadow)">
      <rect width="515" height="320" rx="24" fill="#06120f" stroke="#34d399" stroke-width="3"/>
      <text x="28" y="44" font-size="23" font-weight="700" fill="#a7f3d0">HEAP</text>
      <text x="397" y="44" font-size="14" fill="#64748b">malloc / free</text>

      <g transform="translate(32 80)">
        <rect width="135" height="120" rx="14" fill="url(#heapGrad)"/>
        <text x="16" y="28" font-size="15" fill="#d1fae5">Block A</text>
        <text x="16" y="70" font-size="34" font-weight="800" fill="#fff">1029</text>
        <text x="16" y="102" font-size="13" fill="#a7f3d0">4B int</text>
      </g>
      <g transform="translate(185 80)">
        <rect width="135" height="120" rx="14" fill="#166534" stroke="#4ade80" stroke-width="1.5"/>
        <text x="16" y="28" font-size="15" fill="#dcfce7">Block B</text>
        <text x="16" y="70" font-size="34" font-weight="800" fill="#fff">1037</text>
        <text x="16" y="102" font-size="13" fill="#bbf7d0">4B int</text>
      </g>
      <g transform="translate(338 80)">
        <rect width="142" height="120" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2" stroke-dasharray="8 6"/>
        <text x="25" y="65" font-size="18" font-weight="700" fill="#64748b">FREE</text>
      </g>
      <text x="32" y="256" font-size="15" fill="#64748b">dynamic allocation · fragmentation possible</text>
    </g>

    <path d="M 424 305 C 520 305, 535 300, 632 300" fill="none" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 424 370 C 520 370, 535 375, 785 375" fill="none" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(472 544)">
      <rect width="255" height="42" rx="21" fill="#111827" stroke="#334155"/>
      <text x="28" y="27" font-size="16" font-weight="700" fill="#cbd5e1">pointer → dynamic data</text>
    </g>
  </g>
</svg>
