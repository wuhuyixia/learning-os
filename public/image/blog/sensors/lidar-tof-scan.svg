<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">激光雷达 TOF 测距与扫描</title><desc id="desc">左侧展示飞行时间测距，右侧展示旋转扫描形成点云。</desc>
<defs><linearGradient id="h" x1="0" x2="1"><stop stop-color="#0d5baa"/><stop offset="1" stop-color="#46a4ed"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="650" fill="#f8fbff"/><text x="54" y="66" font-family="system-ui,sans-serif" font-size="38" font-weight="750" fill="#123b78">LiDAR 基础：TOF 测距与扫描方式</text>
<g filter="url(#s)"><rect x="45" y="105" width="530" height="485" rx="28" fill="white" stroke="#badbff"/><rect x="625" y="105" width="530" height="485" rx="28" fill="white" stroke="#badbff"/></g>
<g font-family="system-ui,sans-serif">
<rect x="45" y="105" width="530" height="58" rx="28" fill="url(#h)"/><text x="72" y="144" fill="white" font-size="26" font-weight="700">01  TOF（Time of Flight）测距</text>
<rect x="625" y="105" width="530" height="58" rx="28" fill="url(#h)"/><text x="652" y="144" fill="white" font-size="26" font-weight="700">02  多线 / 旋转扫描形成点云</text>
<g transform="translate(100 220)"><rect x="0" y="20" width="90" height="95" rx="18" fill="#194f82"/><ellipse cx="45" cy="20" rx="45" ry="13" fill="#86caff"/><ellipse cx="45" cy="115" rx="45" ry="13" fill="#0f3e6b"/><text x="45" y="150" text-anchor="middle" font-size="19" fill="#304a63">激光雷达</text></g>
<rect x="450" y="235" width="70" height="110" fill="#aab4be"/><text x="485" y="375" text-anchor="middle" font-size="18" fill="#304a63">目标物体</text>
<path d="M195 270 H445" stroke="#e9473f" stroke-width="5"/><path d="M445 305 H195" stroke="#2980d9" stroke-width="5" stroke-dasharray="10 7"/>
<text x="300" y="255" font-size="19" fill="#e9473f">发射激光</text><text x="300" y="330" font-size="19" fill="#2980d9">反射回波</text>
<line x1="190" y1="420" x2="455" y2="420" stroke="#2e4053" stroke-width="2"/><line x1="190" y1="405" x2="190" y2="435" stroke="#2e4053"/><line x1="455" y1="405" x2="455" y2="435" stroke="#2e4053"/>
<text x="322" y="452" text-anchor="middle" font-size="20" fill="#263d56">往返时间 Δt</text><rect x="145" y="480" width="335" height="72" rx="18" fill="#ecf6ff"/><text x="312" y="526" text-anchor="middle" font-size="32" font-style="italic" fill="#153e6f">d = c · Δt / 2</text>

<g transform="translate(685 225)"><rect x="0" y="30" width="100" height="105" rx="20" fill="#194f82"/><ellipse cx="50" cy="30" rx="50" ry="15" fill="#86caff"/><ellipse cx="50" cy="135" rx="50" ry="15" fill="#0f3e6b"/><path d="M25 156 q25 25 50 0" fill="none" stroke="#297fce" stroke-width="4"/><text x="50" y="190" text-anchor="middle" font-size="18" fill="#304a63">水平旋转 360°</text></g>
<g transform="translate(785 250)" stroke-width="3" fill="none"><path d="M0 35 L260 -40" stroke="#2980d9"/><path d="M0 45 L275 0" stroke="#36a852"/><path d="M0 55 L280 45" stroke="#e8b51d"/><path d="M0 65 L280 90" stroke="#f07b29"/><path d="M0 75 L260 135" stroke="#e9473f"/></g>
<g fill="#2980d9"><circle cx="1045" cy="210" r="5"/><circle cx="1060" cy="250" r="5"/><circle cx="1065" cy="295" r="5"/><circle cx="1060" cy="340" r="5"/><circle cx="1045" cy="385" r="5"/></g>
<path d="M690 500 C760 455 825 480 875 442 S995 470 1080 430" fill="none" stroke="#79aee0" stroke-width="3" stroke-dasharray="5 5"/>
<g fill="#1d88e5" opacity=".85"><circle cx="715" cy="485" r="4"/><circle cx="740" cy="470" r="4"/><circle cx="770" cy="464" r="4"/><circle cx="800" cy="472" r="4"/><circle cx="835" cy="465" r="4"/><circle cx="875" cy="442" r="4"/><circle cx="910" cy="451" r="4"/><circle cx="950" cy="462" r="4"/><circle cx="995" cy="470" r="4"/><circle cx="1040" cy="451" r="4"/><circle cx="1080" cy="430" r="4"/></g>
<text x="890" y="530" text-anchor="middle" font-size="20" fill="#304a63">不同垂直角度 + 水平旋转 → 三维点云</text>
</g></svg>