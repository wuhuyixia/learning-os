<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">激光、视觉、IMU 与 GNSS 传感器概览</title>
<desc id="desc">移动机器人中央，四周展示激光雷达、相机、IMU 和 GNSS 的主要输入输出及互补关系。</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
  <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#0f4c9a"/><stop offset="1" stop-color="#2980d9"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".12"/></filter>
</defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<text x="55" y="70" font-size="38" font-weight="700" fill="#123b78" font-family="system-ui, sans-serif">激光 · 视觉 · IMU · GNSS：机器人四类核心传感器</text>
