  <rect x="854" y="195" width="74" height="58" rx="10" fill="#25374d"/><circle cx="892" cy="224" r="20" fill="#68b4ff"/><circle cx="892" cy="224" r="11" fill="#0d315d"/>
  <path d="M932 203 L1010 183 L1010 265 L932 245 Z" fill="#ffb66b" opacity=".28"/>
