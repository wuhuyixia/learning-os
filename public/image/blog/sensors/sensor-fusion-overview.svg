  <rect x="818" y="112" width="330" height="205" rx="24" fill="white" stroke="#bcdcff"/>
  <rect x="52" y="357" width="330" height="205" rx="24" fill="white" stroke="#bcdcff"/>
  <rect x="818" y="357" width="330" height="205" rx="24" fill="white" stroke="#bcdcff"/>
</g>
