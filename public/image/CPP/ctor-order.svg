<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <style>
      .t{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#1f2937}
      .h{font-size:38px;font-weight:700}
      .b{font-size:28px;font-weight:700}
      .s{font-size:23px}
      .box{stroke-width:3;rx:18}
      .a{fill:#dbeafe;stroke:#2563eb}
      .b1{fill:#dcfce7;stroke:#16a34a}
      .c{fill:#fef3c7;stroke:#d97706}
      .line{stroke:#64748b;stroke-width:4;fill:none}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="600" y="60" text-anchor="middle" class="t h">构造与析构：顺序正好相反</text>

  <text x="250" y="120" text-anchor="middle" class="t b">构造对象</text>
  <rect x="90" y="155" width="320" height="70" class="box a"/><text x="250" y="200" text-anchor="middle" class="t s">① 基类构造函数</text>
  <path d="M250 225 L250 260" class="line" marker-end="url(#arrow)"/>
  <rect x="90" y="275" width="320" height="70" class="box b1"/><text x="250" y="320" text-anchor="middle" class="t s">② 对象成员构造函数</text>
  <path d="M250 345 L250 380" class="line" marker-end="url(#arrow)"/>
  <rect x="90" y="395" width="320" height="70" class="box c"/><text x="250" y="440" text-anchor="middle" class="t s">③ 派生类构造函数</text>

  <text x="950" y="120" text-anchor="middle" class="t b">销毁对象</text>
  <rect x="790" y="155" width="320" height="70" class="box c"/><text x="950" y="200" text-anchor="middle" class="t s">① 派生类析构函数</text>
  <path d="M950 225 L950 260" class="line" marker-end="url(#arrow)"/>
  <rect x="790" y="275" width="320" height="70" class="box b1"/><text x="950" y="320" text-anchor="middle" class="t s">② 对象成员析构函数</text>
  <path d="M950 345 L950 380" class="line" marker-end="url(#arrow)"/>
  <rect x="790" y="395" width="320" height="70" class="box a"/><text x="950" y="440" text-anchor="middle" class="t s">③ 基类析构函数</text>
</svg>