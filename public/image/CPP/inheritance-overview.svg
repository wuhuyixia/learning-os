<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <style>
      .t{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#1f2937}
      .h{font-size:38px;font-weight:700}
      .b{font-size:28px;font-weight:700}
      .s{font-size:24px}
      .box{fill:#f8fafc;stroke:#64748b;stroke-width:3;rx:18}
      .base{fill:#e0f2fe;stroke:#0284c7}
      .child{fill:#ecfdf5;stroke:#10b981}
      .multi{fill:#fef3c7;stroke:#d97706}
      .line{stroke:#64748b;stroke-width:4;fill:none}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="600" y="60" text-anchor="middle" class="t h">C++ 继承：把“已有能力”交给新类</text>

  <rect x="120" y="120" width="300" height="90" class="box base"/>
  <text x="270" y="175" text-anchor="middle" class="t b">Person（基类）</text>
  <path d="M270 210 L270 310" class="line" marker-end="url(#arrow)"/>
  <rect x="120" y="330" width="300" height="90" class="box child"/>
  <text x="270" y="385" text-anchor="middle" class="t b">Student（派生类）</text>
  <text x="270" y="455" text-anchor="middle" class="t s">单继承：一个基类 → 一个派生类</text>

  <rect x="690" y="120" width="220" height="85" class="box base"/>
  <text x="800" y="172" text-anchor="middle" class="t b">Student</text>
  <rect x="940" y="120" width="220" height="85" class="box base"/>
  <text x="1050" y="172" text-anchor="middle" class="t b">Employee</text>
  <path d="M800 205 L800 285 L925 330" class="line" marker-end="url(#arrow)"/>
  <path d="M1050 205 L1050 285 L925 330" class="line" marker-end="url(#arrow)"/>
  <rect x="800" y="350" width="250" height="90" class="box multi"/>
  <text x="925" y="405" text-anchor="middle" class="t b">StudentHasJob</text>
  <text x="925" y="475" text-anchor="middle" class="t s">多继承：多个基类 → 一个派生类</text>

  <rect x="120" y="525" width="1040" height="80" class="box"/>
  <text x="640" y="575" text-anchor="middle" class="t s">记忆：派生类继承基类已有成员，还可以继续增加自己的新成员。</text>
</svg>